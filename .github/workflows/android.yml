name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee unit-test.log

      - name: Build debug APK
        id: apk
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee assemble.log

      - name: Report diagnostics to PR
        if: always() && github.event_name == 'pull_request' && (steps.tests.outcome == 'failure' || steps.apk.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Android CI diagnostics'
            echo
            echo "tests: ${{ steps.tests.outcome }} · APK: ${{ steps.apk.outcome }}"
            echo
            echo '```text'
            if [ -f unit-test.log ]; then echo '--- tests ---'; tail -n 220 unit-test.log; fi
            if [ -f assemble.log ]; then echo '--- assemble ---'; tail -n 180 assemble.log; fi
            echo '```'
          } > ci-comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-comment.md || true

      - name: Fail job when build failed
        if: always() && (steps.tests.outcome == 'failure' || steps.apk.outcome == 'failure')
        run: exit 1

      - name: Upload APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aharon-message-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
